        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .snap-btn.selected {
            background-color: #3b82f6; /* blue-500 */
            color: white;
            border-color: #2563eb; /* blue-600 */
        }
        /* Toast Notification Styles */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            background-color: #fee2e2; /* red-100 */
            border-left: 4px solid #ef4444; /* red-500 */
            color: #b91c1c; /* red-700 */
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateX(100%);
            opacity: 0;
            transition: all 0.3s ease-in-out;
        }
        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }
        .error-highlight {
            background-color: #fef2f2 !important; /* red-50 */
            border: 2px solid #ef4444 !important; /* red-500 */
            transition: all 0.3s ease;
        }

        /* 隱藏數字輸入框上下微調箭頭 */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>

    // 🌟 自動發送個人資料與學科成績至 Google Sheet
    function sendToGoogleSheet(data) {
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxeF4MMa3h_dmOXEa_lQ9OtWhG0XEtLvxQFILCkVsI02K0N5fVp43SmO9rdEnzzyud4/exec";

        const payload = {
            timestamp: new Date().toLocaleString("zh-TW", { timeZone: "Asia/Taipei" }),
            role: data.role === 'student' ? '學生' : '家長',
            name: data.name || '',
            grade: data.grade || '',
            zone: data.zone || '',
            email: data.email || '',
            phone: data.phone || '',
            chinese: (data.subjects.chinese && data.subjects.chinese.active) ? data.subjects.chinese.score : '無',
            english: (data.subjects.english && data.subjects.english.active) ? data.subjects.english.score : '無',
            math: (data.subjects.math && data.subjects.math.active) ? data.subjects.math.score : '無',
            biology: (data.subjects.biology && data.subjects.biology.active) ? data.subjects.biology.score : '無',
            physics: (data.subjects.physics && data.subjects.physics.active) ? data.subjects.physics.score : '無',
            chemistry: (data.subjects.chemistry && data.subjects.chemistry.active) ? data.subjects.chemistry.score : '無',
            earth_science: (data.subjects.earth_science && data.subjects.earth_science.active) ? data.subjects.earth_science.score : '無',
            history: (data.subjects.history && data.subjects.history.active) ? data.subjects.history.score : '無',
            geography: (data.subjects.geography && data.subjects.geography.active) ? data.subjects.geography.score : '無',
            civics: (data.subjects.civics && data.subjects.civics.active) ? data.subjects.civics.score : '無'
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain",
            },
            body: JSON.stringify(payload)
        })
        .then(() => {
            console.log("資料已成功傳送至 Google Sheet！");
        })
        .catch((error) => {
            console.error("傳送資料至 Google Sheet 時發生錯誤：", error);
        });
    }

    function renderView() {
        const container = document.getElementById('app-container');
        container.innerHTML = ''; 

        if (state.currentStep === 0) {
            container.innerHTML = views[0];
        } else if (state.currentStep === 1) {
            // 第一步：學科成績填寫
            container.innerHTML = views[1];
            if (Object.keys(state.data.subjects).length === 0) {
                Object.keys(subjectMap).forEach(key => {
                    state.data.subjects[key] = { active: true, score: '' };
                });
            }
            Object.keys(subjectMap).forEach(key => {
                const subjState = state.data.subjects[key] || { active: true, score: '' };
                const inputEl = document.getElementById(`subj-${key}-score`);
                const naEl = document.getElementById(`subj-${key}-na`);
                if (inputEl && naEl) {
                    inputEl.value = subjState.score;
                    naEl.checked = !subjState.active;
                    if (!subjState.active) {
                        inputEl.disabled = true;
                        inputEl.classList.add('bg-gray-100');
                    }
                }
            });
        } else if (state.currentStep === 2) {
            // 第二步：SNAP-IV 量表評估
            container.innerHTML = views[2];
            state.data.snap.forEach((val, idx) => {
                if (val !== null) {
                    const btn = document.querySelector(`.snap-btn[data-q="${idx}"][data-v="${val}"]`);
                    if(btn) btn.classList.add('selected');
                }
            });
        } else if (state.currentStep === 3) {
            // 第三步：個人基本資料（必填解鎖關卡）
            container.innerHTML = views[3];
            if (state.data.role) document.getElementById('role').value = state.data.role;
            if (state.data.name) document.getElementById('name').value = state.data.name;
            if (state.data.grade) document.getElementById('grade').value = state.data.grade;
            if (state.data.zone) document.getElementById('zone').value = state.data.zone;
            if (state.data.email) document.getElementById('email').value = state.data.email;
            if (state.data.phone) document.getElementById('phone').value = state.data.phone;
        } else if (state.currentStep === 4) {
            container.innerHTML = views[4];
        } else if (state.currentStep === 5) {
            container.innerHTML = views[5];
            populateReport();
        }
    }

    function nextStep() {
        state.currentStep++;
        renderView();
        window.scrollTo(0, 0);
    }

    function toggleSubject(key) {
        if (!state.data.subjects[key]) {
             state.data.subjects[key] = { active: true, score: '' };
        }
        const isNA = document.getElementById(`subj-${key}-na`).checked;
        const input = document.getElementById(`subj-${key}-score`);
        
        state.data.subjects[key].active = !isNA;
        if (isNA) {
            input.disabled = true;
            input.value = '';
            state.data.subjects[key].score = '';
            input.classList.add('bg-gray-100');
        } else {
            input.disabled = false;
            input.classList.remove('bg-gray-100');
        }
    }

    function updateGrade(key, val) {
        if (!state.data.subjects[key]) {
             state.data.subjects[key] = { active: true, score: '' };
        }
        
        if (val === '') {
            state.data.subjects[key].score = '';
            return;
        }

        let num = parseInt(val, 10);
        if (isNaN(num)) {
            state.data.subjects[key].score = '';
            document.getElementById(`subj-${key}-score`).value = '';
            return;
        }

        if (num > 100) num = 100;
        if (num < 0) num = 0;

        state.data.subjects[key].score = num;
        document.getElementById(`subj-${key}-score`).value = num;
    }

    function selectSnap(qIndex, value, btnElement) {
        state.data.snap[qIndex] = value;
        const parent = btnElement.parentElement;
        parent.querySelectorAll('.snap-btn').forEach(b => b.classList.remove('selected'));
        btnElement.classList.add('selected');
        const qContainer = document.getElementById(`q-container-${qIndex}`);
        if(qContainer) {
            qContainer.classList.remove('error-highlight');
        }
    }

    function submitSnap() {
        let missingIndex = -1;
        for(let i = 0; i < 26; i++) {
            if(state.data.snap[i] === null) {
                missingIndex = i;
                break;
            }
        }
        
        if (missingIndex !== -1) {
            showToast("您還有題目尚未作答，請完成所有評估題！");
            const qContainer = document.getElementById(`q-container-${missingIndex}`);
            if(qContainer) {
                qContainer.classList.add('error-highlight');
                qContainer.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            return;
        }

        // SNAP 作答完畢，進入個人資料填寫關卡
        nextStep();
    }

    function populateReport() {
        const { role, name, grade, snap, subjects } = state.data;
        
        const roleText = role === 'student' ? '同學' : '家長';
        let stageCode = 'e'; 
        let levelText = '國小';
        if (grade.startsWith('j')) { stageCode = 'j'; levelText = '國中'; }
        else if (grade.startsWith('s')) { stageCode = 's'; levelText = '高中'; }

        const kb = knowledgeBase[stageCode];
        const displayName = name ? name : '您';
        document.getElementById('report-subtitle').innerText = `為 ${displayName} ${roleText} 量身打造的 ${levelText} 階段自學力提升指南`;

        // ==========================================
        // 1. 學科表現分析
        // ==========================================
        const validGrades = [];
        Object.keys(subjectMap).forEach(key => {
            const s = subjects[key];
            if (s && s.active && s.score !== '') {
                validGrades.push({ key: key, subject: subjectMap[key], score: parseInt(s.score) });
            }
        });

        let academicSummary = "";
        let academicAdvices = [];
        let worstSubjectKey = "";

        if (validGrades.length > 0) {
            validGrades.sort((a, b) => b.score - a.score);
            const best = validGrades[0];
            const worst = validGrades[validGrades.length - 1];
            worstSubjectKey = worst.key;
            const avg = Math.round(validGrades.reduce((acc, curr) => acc + curr.score, 0) / validGrades.length);

            academicSummary = `Hi ${displayName}，我是星星老師！看過成績後，我發現你的平均表現落在 **${avg}** 分。非常棒的是，你在 **${best.subject}**（${best.score}分）展現了絕佳的理解力，請記住這份成就感，這是你未來的絕對優勢！至於 **${worst.subject}**（${worst.score}分）暫時卡關也沒關係，老師不會直接給你答案，但以下是我為你準備的專屬自學破關策略：`;

            academicAdvices.push(`💡 ${kb.core[1]}`);
