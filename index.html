    function showToast(message) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<span class="text-xl">⚠️</span><div class="font-medium">${message}</div>`;
        container.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
    }

            showToast("✨ 報告已成功寄送至：" + email);
            btnElement.innerHTML = `<span>✅</span> 已成功寄出`;
            btnElement.classList.replace('bg-indigo-100', 'bg-green-100');
            btnElement.classList.replace('text-indigo-700', 'text-green-700');
        }).catch(err => {
            showToast("網路異常，寄送失敗，請稍後再試或直接列印報告！");
            btnElement.innerHTML = originalText;
            btnElement.disabled = false;
            btnElement.classList.remove('opacity-75', 'cursor-not-allowed');
        });
    }

    function renderView() {
        const container = document.getElementById('app-container');
        container.innerHTML = views[state.currentStep];
        
        if (state.currentStep === 1) {
            if (Object.keys(state.data.subjects).length === 0) {
                Object.keys(subjectMap).forEach(key => state.data.subjects[key] = { active: true, score: '' });
            }
            Object.keys(subjectMap).forEach(key => {
                const subjState = state.data.subjects[key];
                document.getElementById(`subj-${key}-score`).value = subjState.score;
                document.getElementById(`subj-${key}-na`).checked = !subjState.active;
                if (!subjState.active) {
                    document.getElementById(`subj-${key}-score`).disabled = true;
                    document.getElementById(`subj-${key}-score`).classList.add('bg-gray-100');
                }
            });
        } else if (state.currentStep === 2) {
            state.data.snap.forEach((val, idx) => {
                if (val !== null) {
                    const btn = document.querySelector(`.snap-btn[data-q="${idx}"][data-v="${val}"]`);
                    if(btn) btn.classList.add('selected');
                }
            });
        } else if (state.currentStep === 3) {
            if (state.data.role) document.getElementById('role').value = state.data.role;
            if (state.data.name) document.getElementById('name').value = state.data.name;
            if (state.data.grade) document.getElementById('grade').value = state.data.grade;
            if (state.data.zone) document.getElementById('zone').value = state.data.zone;
            if (state.data.email) document.getElementById('email').value = state.data.email;
            if (state.data.phone) document.getElementById('phone').value = state.data.phone;
        } else if (state.currentStep === 5) {
            populateReport();
        }
    }

    function nextStep() {
        state.currentStep++;
        renderView();
        window.scrollTo(0, 0);
    }

    function toggleSubject(key) {
        if (!state.data.subjects[key]) state.data.subjects[key] = { active: true, score: '' };
        const isNA = document.getElementById(`subj-${key}-na`).checked;
        const input = document.getElementById(`subj-${key}-score`);
        state.data.subjects[key].active = !isNA;
        if (isNA) {
            input.disabled = true; input.value = '';
            state.data.subjects[key].score = '';
            input.classList.add('bg-gray-100');
        } else {
            input.disabled = false; input.classList.remove('bg-gray-100');
        }
    }

    function updateGrade(key, val) {
        if (val === '') { state.data.subjects[key].score = ''; return; }
        let num = parseInt(val, 10);
        if (isNaN(num)) { state.data.subjects[key].score = ''; return; }
        if (num > 100) num = 100; if (num < 0) num = 0;
        state.data.subjects[key].score = num;
        document.getElementById(`subj-${key}-score`).value = num;
    }

    function selectSnap(qIndex, value, btnElement) {
        state.data.snap[qIndex] = value;
        btnElement.parentElement.querySelectorAll('.snap-btn').forEach(b => b.classList.remove('selected'));
        btnElement.classList.add('selected');
        const qContainer = document.getElementById(`q-container-${qIndex}`);
        if(qContainer) qContainer.classList.remove('error-highlight');
    }

    function generateSnapSection(title, qs, startIndex) {
        let html = `<div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-8"><h3 class="text-xl font-bold mb-4 text-blue-800 border-b pb-2">${title}</h3><div class="space-y-6">`;
        qs.forEach((q, idx) => {
            const actualIndex = startIndex + idx;
            html += `
                <div id="q-container-${actualIndex}" class="flex flex-col md:flex-row md:items-center justify-between p-4 bg-gray-50 rounded-xl gap-4 transition-colors">
                    <div class="md:w-3/5 text-gray-700 font-medium">${q}</div>
                    <div class="md:w-2/5 flex justify-between gap-2">
                        <button onclick="selectSnap(${actualIndex}, 0, this)" class="snap-btn w-1/4 py-2 border rounded-lg text-sm bg-white hover:bg-gray-100" data-q="${actualIndex}" data-v="0">0<br><span class="text-xs">完全沒有</span></button>
                        <button onclick="selectSnap(${actualIndex}, 1, this)" class="snap-btn w-1/4 py-2 border rounded-lg text-sm bg-white hover:bg-gray-100" data-q="${actualIndex}" data-v="1">1<br><span class="text-xs">有一點點</span></button>
                        <button onclick="selectSnap(${actualIndex}, 2, this)" class="snap-btn w-1/4 py-2 border rounded-lg text-sm bg-white hover:bg-gray-100" data-q="${actualIndex}" data-v="2">2<br><span class="text-xs">還算不少</span></button>
                        <button onclick="selectSnap(${actualIndex}, 3, this)" class="snap-btn w-1/4 py-2 border rounded-lg text-sm bg-white hover:bg-gray-100" data-q="${actualIndex}" data-v="3">3<br><span class="text-xs">非常的多</span></button>
                    </div>
                </div>`;
        });
        return html + `</div></div>`;
    }

    function validateSnapAndGoNext() {
        const missingIndex = state.data.snap.findIndex(v => v === null);
        if (missingIndex !== -1) {
            showToast("您還有題目尚未作答，請完成所有評估！");
            const qContainer = document.getElementById(`q-container-${missingIndex}`);
            if(qContainer) { qContainer.classList.add('error-highlight'); qContainer.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
            return;
        }
        nextStep();
    }

    function submitAll() {
        const role = document.getElementById('role').value;
        const name = document.getElementById('name').value;
        const grade = document.getElementById('grade').value;
        const zone = document.getElementById('zone').value;
        
        if (!role || !name || !grade || !zone) {
            showToast("請填寫所有標示 * 的基本資料欄位！");
            return;
        }
        
        state.data.role = role; state.data.name = name;
        state.data.grade = grade; state.data.zone = zone;
        state.data.email = document.getElementById('email').value;
        state.data.phone = document.getElementById('phone').value;

        const sheetPayload = {
            role: state.data.role,
            name: state.data.name,
            grade: state.data.grade,
            zone: state.data.zone,
            email: state.data.email,
            phone: state.data.phone
        };
        
        Object.keys(subjectMap).forEach(key => {
            sheetPayload[key] = (state.data.subjects[key] && state.data.subjects[key].score !== '') 
                                ? state.data.subjects[key].score 
                                : '無';
        });

        sendToGoogleSheet(sheetPayload);
        
        state.currentStep = 4; renderView();
        setTimeout(() => { state.currentStep = 5; renderView(); }, 2000); 
    }

    function populateReport() {
        const { role, name, grade, zone, snap, subjects } = state.data;
        const roleText = role === 'student' ? '同學' : '家長';
        const displayName = name || '您';
        
        let phaseKey = ''; let stageCode = ''; let levelText = '';
        if (['e1', 'e2', 'e3', 'e4'].includes(grade)) { phaseKey = 'e_lower'; stageCode = 'e'; levelText = '國小低/中年級'; }
        else if (['e5', 'e6'].includes(grade)) { phaseKey = 'e_upper'; stageCode = 'e'; levelText = '國小高年級'; }
        else if (grade.startsWith('j')) { phaseKey = 'j'; stageCode = 'j'; levelText = '國中'; }
        else if (grade.startsWith('s')) { phaseKey = 's'; stageCode = 's'; levelText = '高中'; }

        document.getElementById('report-subtitle').innerText = `為 ${displayName} ${roleText} 量身打造的 ${levelText} 階段自學力指南`;

        const validGrades = Object.keys(subjectMap)
            .filter(key => subjects[key] && subjects[key].active && subjects[key].score !== '')
            .map(key => ({ key, subject: subjectMap[key], score: parseInt(subjects[key].score) }));

        let academicAdvices = [];
        let worstSubjectKey = "";

        if (validGrades.length > 0) {
            validGrades.sort((a, b) => b.score - a.score);
            const best = validGrades[0]; const worst = validGrades[validGrades.length - 1];
            worstSubjectKey = worst.key;
            const avg = Math.round(validGrades.reduce((acc, curr) => acc + curr.score, 0) / validGrades.length);

            document.getElementById('academic-summary-text').innerHTML = `Hi ${displayName}，你的平均落在 <strong class="text-blue-800">${avg}</strong> 分。非常棒的是，你在 <strong class="text-blue-800">${best.subject}（${best.score}分）</strong>展現了優勢！至於 <strong class="text-blue-800">${worst.subject}（${worst.score}分）</strong>暫時卡關也沒關係，請參考以下破關策略：`;
        } else {
            document.getElementById('academic-no-data').classList.remove('hidden');
            document.getElementById('academic-summary-text').innerHTML = `Hi ${displayName}，以下為你準備了這個階段最重要的自學心法，幫助你先建立好學習的「底層作業系統」：`;
        }

        if (phaseKey && phaseIntelligence[phaseKey]) {
            academicAdvices.push(`🌱 ${phaseIntelligence[phaseKey].academic}`);
            academicAdvices.push(`🎯 ${phaseIntelligence[phaseKey].exam}`);
        }

        if (validGrades.length > 0 && knowledgeBase[stageCode].subjects[worstSubjectKey]) {
            academicAdvices.push(`🔍 ${knowledgeBase[stageCode].subjects[worstSubjectKey]}`);
        }

        if (phaseKey === 'j' && zone && zoneIntelligence[zone]) {
            academicAdvices.push(`🗺️ ${zoneIntelligence[zone]}`);
        }

        const advList = document.getElementById('academic-advice-list');
        advList.innerHTML = '';
        academicAdvices.forEach(adv => {
            const li = document.createElement('li');
            li.innerHTML = adv.replace(/\*\*(.*?)\*\*/g, '<strong class="text-blue-900">$1</strong>');
            advList.appendChild(li);
        });

        let inattCount = 0; let hyperCount = 0; let oppoCount = 0;  
        for(let i=0; i<9; i++) if(snap[i] >= 2) inattCount++;
        for(let i=9; i<18; i++) if(snap[i] >= 2) hyperCount++;
        for(let i=18; i<26; i++) if(snap[i] >= 2) oppoCount++;

        document.getElementById('behavior-summary-text').innerHTML = `過去半年行為指標分析：<strong class="text-orange-800">注意力與組織力</strong> 警訊 ${inattCount} 項、<strong class="text-orange-800">活動量與衝動</strong> ${hyperCount} 項、<strong class="text-orange-800">情緒與對立</strong> ${oppoCount} 項。`;

        if (inattCount >= 6 || hyperCount >= 6 || oppoCount >= 4) {
            document.getElementById('alert-container').classList.remove('hidden');
            document.getElementById('snap-alert-text').innerHTML = `若情況影響成效，<strong class="text-red-900 font-bold">強烈建議尋求「兒童心智科」或「身心科」醫師進一步評估</strong>，排除生理上的學習障礙！`;
        }

        let behaviorAdvices = [];
        if (inattCount >= 4) behaviorAdvices.push(`⏱️ ${knowledgeBase[stageCode].behavior.inattention}`);
        else behaviorAdvices.push(`🎯 **【專注力維持良好】**：展現了不錯的專注力與規劃能力。請試著挑戰訂定更長期的學習計畫！`);
        
        if (hyperCount >= 4 || oppoCount >= 3) behaviorAdvices.push(`🤝 ${knowledgeBase[stageCode].behavior.hyper_oppo}`);

        if (phaseKey && phaseIntelligence[phaseKey]) {
            if (role === 'parent') {
                behaviorAdvices.push(`👨‍👩‍👧 ${phaseIntelligence[phaseKey].parent}`);
            } else {
                let roleIdea = phaseKey === 's' ? '顧問' : (phaseKey === 'j' ? '最堅實的後盾' : '溫和的引導者與教練');
                behaviorAdvices.push(`🤝 **【給神隊友的溝通建議】** 建議將報告與家長分享，因為父母現在最適合扮演「${roleIdea}」的角色，陪伴你成長！`);
            }
        }
        
        behaviorAdvices.push(`🌟 **【弱勢與特殊身份保障】**：若符合法定特種身分（如原住民、身心障礙、經濟弱勢等），請務必善用各升學管道之加分與優先資源。`);

        const behList = document.getElementById('behavior-advice-list');
        behList.innerHTML = '';
        behaviorAdvices.forEach(adv => {
            const li = document.createElement('li');
            li.innerHTML = adv.replace(/\*\*(.*?)\*\*/g, '<strong class="text-orange-900">$1</strong>');
            behList.appendChild(li);
        });

        state.data.reportSummary = {
            academic: academicAdvices.map(a => a.replace(/\*\*(.*?)\*\*/g, '$1')).join('\n'),
            behavior: behaviorAdvices.map(a => a.replace(/\*\*(.*?)\*\*/g, '$1')).join('\n')
        };

        renderCharts(validGrades, inattCount, hyperCount, oppoCount);
    }
